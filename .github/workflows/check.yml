name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (oxlint, erro falha o build)
        run: pnpm lint
      - name: Testes (node:test)
        run: pnpm test
      - name: Build web
        run: pnpm build
        env:
          WEB_BASE: /nebulatune/
