name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["apk.yml"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar version.json
        run: |
          node --input-type=module -e "import {APP_VERSION} from './src/app-config.js'; process.stdout.write(JSON.stringify({version:String(APP_VERSION||'1.0.0')}))" > public/version.json
      - name: Build web
        run: pnpm build
        env:
          WEB_BASE: /nebulatune/
      - name: Incluir APK mais recente no site
        run: |
          set -euo pipefail
          # Pega o nebulatune.apk da última Release do GitHub e coloca em dist/apk/,
          # para o link /apk/nebulatune.apk do site sempre servir o APK novo.
          URL=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s);const a=(r.assets||[]).find(x=>x.name==='nebulatune.apk');console.log(a?a.browser_download_url:'')}catch{console.log('')}})")
          if [ -n "$URL" ]; then
            mkdir -p dist/apk
            curl -fsSL "$URL" -o dist/apk/nebulatune.apk
            echo "APK incluido no site: $URL"
          else
            echo "Nenhum APK em release ainda; site sem /apk/nebulatune.apk"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
